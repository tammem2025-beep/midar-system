name: M Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Run automated tests
        env:
          APP_ENV: test
          SECRET_KEY: m-installer-build-test-secret-key-0123456789abcdef
        run: python -m pytest -q

      - name: Compile Python source
        run: python -m compileall -q backend desktop_launcher.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check frontend/i18n.js
          node --check frontend/app.js
          node --check frontend/settings-enhanced.js
          node --check frontend/command-center.js

      - name: Build desktop application directory
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name M --paths backend --collect-submodules app --collect-all uvicorn --collect-all cryptography --collect-all PIL --collect-all sqlalchemy.dialects.sqlite --collect-all email_validator desktop_launcher.py
          if (!(Test-Path "dist\M\M.exe")) { throw "PyInstaller did not produce dist\M\M.exe" }

      - name: Sign desktop executable before packaging when a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD) -or $env:WINDOWS_SIGNING_CERT_BASE64 -notmatch '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$') {
            Write-Host "No valid trusted certificate configured. M.exe will remain unsigned; SmartScreen warnings may still appear."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "m-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          try {
            $sdk = ${env:ProgramFiles(x86)}
            $signtool = Get-ChildItem (Join-Path $sdk "Windows Kits\10\bin\*\x64\signtool.exe") -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if (!$signtool) { throw "SignTool was not found on the Windows runner." }
            $appBinary = Get-Item "dist\M\M.exe" -ErrorAction SilentlyContinue
            if (!$appBinary) { throw "M.exe was not found before packaging." }
            & $signtool.FullName sign /fd SHA256 /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 $appBinary.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for M.exe." }
            & $signtool.FullName verify /pa /all $appBinary.FullName
            if ($LASTEXITCODE -ne 0) { throw "M.exe signature verification failed." }
          } finally { Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $iscc = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            $iscc = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          & $iscc "installer\M.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = Get-ChildItem "installer\output\M-Setup-*-Windows-x64.exe" | Select-Object -First 1
          if (!$installer) { throw "The Windows installer executable was not created." }
          Write-Host "Built installer: $($installer.FullName)"

      - name: Sign installer when a trusted Authenticode certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD) -or $env:WINDOWS_SIGNING_CERT_BASE64 -notmatch '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$') {
            Write-Host "No valid trusted certificate configured. Portable executable and installer remain unsigned; SmartScreen warnings may still appear."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "m-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          try {
            $sdk = ${env:ProgramFiles(x86)}
            $signtool = Get-ChildItem (Join-Path $sdk "Windows Kits\10\bin\*\x64\signtool.exe") -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if (!$signtool) { throw "SignTool was not found on the Windows runner." }
            $installer = Get-ChildItem "installer\output\M-Setup-*-Windows-x64.exe" | Select-Object -First 1
            if (!$installer) { throw "Installer EXE was not found." }
            & $signtool.FullName sign /fd SHA256 /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($installer.Name)." }
            & $signtool.FullName verify /pa /all $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification failed for $($installer.Name)." }
          } finally { Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue }

      - name: Package portable Windows ZIP
        shell: pwsh
        run: |
          $portableRoot = "dist\M-Portable"
          if (Test-Path $portableRoot) { Remove-Item -LiteralPath $portableRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null
          Copy-Item -Path "dist\M\*" -Destination $portableRoot -Recurse -Force
          Set-Content -LiteralPath (Join-Path $portableRoot "portable-mode.flag") -Value "M-PORTABLE-DATA-V1" -Encoding Ascii
          New-Item -ItemType Directory -Path "installer\output" -Force | Out-Null
          $archive = "installer\output\M-Portable-0.23.1-Windows-x64.zip"
          Compress-Archive -Path "$portableRoot\*" -DestinationPath $archive -CompressionLevel Optimal -Force
          if (!(Test-Path $archive)) { throw "Portable ZIP was not created." }
          Write-Host "Built portable package: $archive"

      - name: Generate SHA-256 checksums for release packages
        shell: pwsh
        run: |
          $targets = @()
          $installer = Get-ChildItem "installer\output\M-Setup-*-Windows-x64.exe" | Select-Object -First 1
          $portable = Get-ChildItem "installer\output\M-Portable-0.23.1-Windows-x64.zip" | Select-Object -First 1
          if ($installer) { $targets += $installer }
          if ($portable) { $targets += $portable }
          if ($targets.Count -lt 2) { throw "Expected installer and portable ZIP before writing checksums." }
          $lines = foreach ($target in $targets) {
            $hash = Get-FileHash -LiteralPath $target.FullName -Algorithm SHA256
            "{0}  {1}" -f $hash.Hash, $target.Name
          }
          $lines | Set-Content -LiteralPath "installer\output\SHA256SUMS.txt" -Encoding Ascii

      - name: Upload portable Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: M-Windows-x64-Portable
          path: |
            installer/output/M-Portable-0.23.1-Windows-x64.zip
            installer/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: M-Windows-x64-Installer
          path: |
            installer/output/M-Setup-*-Windows-x64.exe
            installer/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer on GitHub Releases
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.23.1' }}
          target_commitish: ${{ github.sha }}
          name: M 0.23.1 — Windows x64
          files: |
            installer/output/M-Setup-*-Windows-x64.exe
            installer/output/M-Portable-0.23.1-Windows-x64.zip
            installer/output/SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
